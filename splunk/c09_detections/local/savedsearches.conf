# C09 scheduled alerts: requires an active Splunk Enterprise/Developer license.
# C09-ALERTS-01 rev 1: local tracking only; runtime validation is required.

[D1_password_guessing]
search = index=c09 event=auth outcome=failure | bin _time span=5m | stats count by _time, src_ip, src_port, user_ref | where count >= 5
dispatch.earliest_time = -5m
dispatch.latest_time = now
enableSched = 1
counttype = number of events
relation = greater than
quantity = 0
alert.track = 1
action.email = 0
action.script = 0
action.webhook = 0
alert.digest_mode = 1
cron_schedule = */5 * * * *
alert.severity = 4
description = At least five auth failures for one account and source endpoint in a 5-minute bin.

[D2_password_spraying]
search = index=c09 event=auth outcome=failure | bin _time span=5m | stats dc(user_ref) as accounts by _time, src_ip | where accounts >= 5
dispatch.earliest_time = -5m
dispatch.latest_time = now
enableSched = 1
counttype = number of events
relation = greater than
quantity = 0
alert.track = 1
action.email = 0
action.script = 0
action.webhook = 0
alert.digest_mode = 1
cron_schedule = */5 * * * *
alert.severity = 4
description = At least five distinct accounts fail from one source IP in a 5-minute bin.

[D3a_multi_endpoint_auth]
search = index=c09 event=auth outcome=success | bin _time span=10m | stats dc(src_port) as endpoints values(src_ip) as src_ip by _time, user_ref | where endpoints >= 2
dispatch.earliest_time = -10m
dispatch.latest_time = now
enableSched = 1
counttype = number of events
relation = greater than
quantity = 0
alert.track = 1
action.email = 0
action.script = 0
action.webhook = 0
alert.digest_mode = 1
cron_schedule = */10 * * * *
alert.severity = 3
description = One account authenticates successfully from at least two source ports in a 10-minute bin.

[D3b_concurrent_sessions]
search = index=c09 (event=auth OR event=join_handoff OR event=player_join OR event=player_timeout) | sort 0 _time | eval ep=src_ip."|".src_port | eval ur=if(event=="auth" AND outcome=="success", user_ref, null()) | streamstats current=t latest(ur) as acct by ep | where isnotnull(acct) AND (event=="player_join" OR event=="player_timeout") | eval delta=case(event=="player_join",1,event=="player_timeout",-1,true(),0) | streamstats current=t sum(delta) as live_sessions by acct | where event=="player_join" AND live_sessions>=2 | table _time, acct, ep, live_sessions
dispatch.earliest_time = -10m
dispatch.latest_time = now
enableSched = 1
counttype = number of events
relation = greater than
quantity = 0
alert.track = 1
action.email = 0
action.script = 0
action.webhook = 0
alert.digest_mode = 1
cron_schedule = */5 * * * *
alert.severity = 3
description = Two or more concurrent game sessions for one account (user_ref), correlated via auth and player_join/player_timeout. Validated 2026-10-14.

[D4_unauth_game_join]
search = index=c09 (event=join_handoff OR event=player_join) | sort 0 _time | eval ep=src_ip."|".src_port | streamstats time_window=5m current=t latest(eval(if(event=="join_handoff",_time,null()))) as last_handoff by ep | where event=="player_join" AND (isnull(last_handoff) OR last_handoff < (_time - 300)) | table _time, src_ip, src_port
dispatch.earliest_time = -5m
dispatch.latest_time = now
enableSched = 1
counttype = number of events
relation = greater than
quantity = 0
alert.track = 1
action.email = 0
action.script = 0
action.webhook = 0
alert.digest_mode = 1
cron_schedule = */5 * * * *
alert.severity = 3
description = Game join has no matching source-endpoint handoff in the prior five minutes.

[D5_unauth_master_action]
search = index=c09 (event=lobby_create OR event=join_handoff) authenticated=false | table _time, event, src_ip, src_port, lobby_id
dispatch.earliest_time = -5m
dispatch.latest_time = now
enableSched = 1
counttype = number of events
relation = greater than
quantity = 0
alert.track = 1
action.email = 0
action.script = 0
action.webhook = 0
alert.digest_mode = 1
cron_schedule = */5 * * * *
alert.severity = 4
description = Lobby creation or handoff is observed with authenticated=false.

[D6_lobby_creation_burst]
search = index=c09 event=lobby_create | bin _time span=1m | stats count by _time, src_ip | where count >= 10
dispatch.earliest_time = -1m
dispatch.latest_time = now
enableSched = 1
counttype = number of events
relation = greater than
quantity = 0
alert.track = 1
action.email = 0
action.script = 0
action.webhook = 0
alert.digest_mode = 1
cron_schedule = * * * * *
alert.severity = 3
description = At least ten lobby creations from one source IP in a 1-minute bin.
